apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-allow
  namespace: shop
spec:
  endpointSelector:
    matchLabels:
      app: api
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: frontend
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        - method: "GET"
          path: "/products"
        - method: "POST"
          path: "/orders"
  - fromEndpoints:
    - matchLabels:
        app: admin
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        - path: "/admin/.*"
        - method: "GET"
          path: "/products"
